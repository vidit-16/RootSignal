[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rootsignal"
version = "0.1.0"
description = "Evidence-backed analytics for sales, supply, and business performance."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

dashboard = [
    "streamlit>=1.35,<2",
    "plotly>=5.22,<7",
]

ai = [
    "openai>=1.50,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Correctness, not formatting. F is pyflakes; B is bugbear, which is where the
# rules that catch real defects live rather than style opinions -- B905 (a zip
# without strict= silently truncates to the shorter side, which in the signal
# engine meant a weaker mask and quietly wrong rows) and B023 (a closure reading
# a loop variable when it runs rather than when it was made).
#
# E is deliberately absent. It is 176 line-length complaints and no defects.
select = ["F", "B"]

[tool.setuptools.packages.find]
where = ["src"]
