name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.12, so the top of that range has to be tested
        # too. The container already proves the numpy range honest by resolving
        # the top of it; this does the same for the Python range, and without it
        # the floor was the only version anyone had ever run.
        python-version: ["3.12", "3.13"]

    # The warehouse tests compare every query on PostgreSQL with SQLite. Without
    # a server they skip, so CI provides one rather than letting them pass by
    # not running.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rootsignal
          POSTGRES_PASSWORD: rootsignal
          POSTGRES_DB: rootsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootsignal"
          --health-interval 5s
          --health-retries 10

    env:
      ROOTSIGNAL_WAREHOUSE_URL: postgresql://rootsignal:rootsignal@localhost:5432/rootsignal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Spark runs on the JVM; the conform job's tests need one.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev,pipeline]"

      - name: Generate controlled sample dataset
        run: python scripts/generate_sample_data.py --output-dir data/raw/generated

      - name: Run test suite
        run: pytest -rs

      - name: Run Ruff checks
        run: ruff check .

  container:
    name: Container builds and passes its own tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The image is a documented entry point in the README, so a Dockerfile
      # that stops building is a broken promise rather than a stale extra.
      - name: Build the image
        run: docker build -t rootsignal .

      # The image resolves the top of the declared dependency range rather than
      # a lockfile. Running the suite inside it is what catches a dependency
      # that has moved under the project, which is how the numpy 2.x
      # deprecation in the forecasting layer was found.
      - name: Run the suite inside the image
        run: docker run --rm rootsignal pytest

      - name: Check the worked example still reproduces
        run: |
          docker run --rm rootsignal python scripts/detect_signals.py \
            | grep -q "BLR | Fruits"
