# docker compose up          -> the dashboard on http://localhost:8501
# docker compose run --rm checks
#
# Two services over one image: the dashboard someone looks at, and the checks
# that back what it shows.

services:
  dashboard:
    build: .
    image: rootsignal
    ports:
      - "8501:8501"
    volumes:
      # Workbooks written inside the container land in the working tree.
      - ./reports:/app/reports
    environment:
      # The explanation layer runs fully without this and records why it fell
      # back to the deterministic briefing. Set it only to exercise the
      # optional rewrite, which is verified against the computed numbers.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  checks:
    build: .
    image: rootsignal
    profiles: ["tools"]
    command: pytest

  # Source to warehouse: land the published data, conform it in Spark, load
  # it into the warehouse below. The lake is ./data/lake on the host.
  pipeline:
    build: .
    image: rootsignal
    profiles: ["tools"]
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      - ROOTSIGNAL_WAREHOUSE_URL=postgresql://rootsignal:rootsignal@warehouse:5432/rootsignal
    volumes:
      - ./data:/app/data
    command: python scripts/run_pipeline.py

  # The warehouse the pipeline loads into. Credentials are for a local
  # container only; a deployed warehouse takes its URL from the environment.
  warehouse:
    image: postgres:16
    environment:
      - POSTGRES_USER=rootsignal
      - POSTGRES_PASSWORD=rootsignal
      - POSTGRES_DB=rootsignal
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootsignal"]
      interval: 5s
      retries: 10

volumes:
  warehouse-data:
